[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-resilience"
version = "0.1.0"
description = "Earth observation features for smallholder resilience modelling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bruel Tchiofouo Yemelo"}]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
]

[project.optional-dependencies]
fetch = ["pystac-client>=0.7"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
