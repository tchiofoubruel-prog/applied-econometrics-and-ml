# Unit tests for the eo-resilience package. Unlike the two syntax checks in
# this repository, this workflow executes code. Almost every test builds its
# own rasters in a temporary directory, so the source data is never needed.
# The seven tests in test_sample.py read the real Togo cube, which is fetched
# from the CropHarvest repository and skipped if that fetch fails.
name: Tests

on:
  push:
    paths:
      - "python-projects/eo-resilience/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "python-projects/eo-resilience/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-projects/eo-resilience
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the test suite
        run: python -m pytest -q
